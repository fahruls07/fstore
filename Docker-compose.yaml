version: '3.8'

services:
  nginx:
    build:
      context: ./nginx
    container_name: fstore_nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      #- backend

  frontend:
    build:
      context: ./frontend
    container_name: fstore_frontend
    expose:
      - "80"

