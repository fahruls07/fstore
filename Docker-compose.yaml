version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    volumes:
      - ./frontend/src:/app
  nginx:
    build:
      context: ./nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
