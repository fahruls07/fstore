version: '3.8'
services:
  nginx:
    build:
      context: ./nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    volumes:
      - ./frontend/src:/app
  backend:
    build: ./backend
    ports:
      - "5000:5000"
